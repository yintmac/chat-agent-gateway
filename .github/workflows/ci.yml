name: Tests
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked --no-sync python -m unittest discover -s tests -t .
        env:
          PYTHONIOENCODING: utf-8
      - run: uvx ruff@0.15.20 check .
      - run: uvx ruff@0.15.20 format --check .
